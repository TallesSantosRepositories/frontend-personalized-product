name: Deploy Staging

on:
  push:
    branches: [developer]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: StagingDigitalOceanEnvs

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "Host ${{ secrets.HOST }}" >> ~/.ssh/config
          echo "  StrictHostKeyChecking no" >> ~/.ssh/config
          echo "  IdentityFile ~/.ssh/deploy_key" >> ~/.ssh/config

      - name: Copiar arquivos para o servidor
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./ root@${{ secrets.HOST }}:/app/staging/ \
            --exclude='.git' --exclude='node_modules'

      - name: Build e restart Docker
        run: |
          ssh -i ~/.ssh/deploy_key root@${{ secrets.HOST }} "
            cd /app/staging &&
            docker build -t app-staging . &&
            docker stop app-staging 2>/dev/null || true &&
            docker rm app-staging 2>/dev/null || true &&
            docker run -d --name app-staging \
              --restart unless-stopped \
              -p 3000:80 app-staging
          "