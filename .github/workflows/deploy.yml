name: Deploy para DigitalOcean

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: DigitalOceanEnvs

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Debug secrets
        run: |
          echo "SSH_HOST: '${{ secrets.SSH_HOST }}'"
          echo "SSH_USER: '${{ secrets.SSH_USER }}'"

      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 22 -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sincronizar arquivos via rsync
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/personalizedproducts.app/html/ \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='README.md'
